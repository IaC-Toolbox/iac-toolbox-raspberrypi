---
# ================================================
# IaC Toolbox - Node Exporter Uninstall Playbook
# ================================================

- name: Uninstall Node Exporter
  hosts: all
  gather_facts: true
  tasks:

    # ── Linux (systemd) ───────────────────────────────────────
    - name: Stop node_exporter service (Linux)
      systemd:
        name: node_exporter
        state: stopped
        enabled: false
      become: true
      ignore_errors: true
      when: ansible_facts['system'] == 'Linux'

    - name: Remove node_exporter systemd service file (Linux)
      file:
        path: /etc/systemd/system/node_exporter.service
        state: absent
      become: true
      when: ansible_facts['system'] == 'Linux'

    - name: Reload systemd daemon (Linux)
      systemd:
        daemon_reload: true
      become: true
      when: ansible_facts['system'] == 'Linux'

    - name: Remove node_exporter binary (Linux)
      file:
        path: /usr/local/bin/node_exporter
        state: absent
      become: true
      when: ansible_facts['system'] == 'Linux'

    # ── macOS (launchd) ───────────────────────────────────────
    - name: Unload node_exporter launchd agent (macOS)
      command: launchctl unload ~/Library/LaunchAgents/com.node-exporter.plist
      ignore_errors: true
      when: ansible_facts['system'] == 'Darwin'

    - name: Remove node_exporter launchd plist (macOS)
      file:
        path: "{{ ansible_env.HOME }}/Library/LaunchAgents/com.node-exporter.plist"
        state: absent
      when: ansible_facts['system'] == 'Darwin'

    - name: Remove node_exporter base directory (macOS)
      file:
        path: "{{ ansible_env.HOME }}/.iac-toolbox/node-exporter"
        state: absent
      when: ansible_facts['system'] == 'Darwin'

    - name: Display uninstall summary
      debug:
        msg: "Node Exporter has been removed."
