---
- name: Merge pgvector config with defaults
  set_fact:
    pg_vector: "{{ pgvector_defaults | combine(pg_vector | default({}), recursive=True) }}"

- name: Ensure pgvector data directory exists
  file:
    path: "{{ pgvector_base_dir }}/data"
    state: directory
    mode: "0750"

- name: Ensure pgvector init directory exists
  file:
    path: "{{ pgvector_base_dir }}/init"
    state: directory
    mode: "0750"

- name: Copy vector extension init script
  copy:
    src: 01-enable-vector.sql
    dest: "{{ pgvector_base_dir }}/init/01-enable-vector.sql"
    mode: "0644"

- name: Deploy docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ pgvector_base_dir }}/docker-compose.yml"
    mode: "0640"
  no_log: true

- name: Start pgvector
  shell: |
    source {{ iac_shell_profile }} 2>/dev/null
    docker compose -f {{ pgvector_base_dir }}/docker-compose.yml up -d
  args:
    executable: "{{ iac_shell_executable }}"

- name: Wait for pgvector to accept connections
  shell: |
    docker exec pgvector-db pg_isready -U postgres
  register: pg_ready
  retries: 30
  delay: 2
  until: pg_ready.rc == 0
  changed_when: false
