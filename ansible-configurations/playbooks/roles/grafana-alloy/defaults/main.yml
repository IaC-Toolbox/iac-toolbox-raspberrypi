---
# Default variables for grafana-alloy role (metrics push)
alloy_version: "1.2.1"
alloy_remote_write_url: "https://grafana.iac-toolbox.com/prometheus/api/v1/write"
alloy_port: 12345
alloy_config_dir: "/etc/alloy"
alloy_base_dir: "{{ ansible_env.HOME }}/.iac-toolbox/grafana-alloy"
alloy_docker_host: "host.docker.internal"

# Port where node_exporter is running on this host (used by scrape config)
node_exporter_port: 9100
cadvisor_port: 8080

# OTLP receiver ports — used by instrumented services to push telemetry
otlp_grpc_port: 4317   # gRPC endpoint (preferred for performance)
otlp_http_port: 4318   # HTTP/Protobuf endpoint (easier to test with curl)
