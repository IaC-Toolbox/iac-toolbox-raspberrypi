---
- name: Merge postgresql config with defaults
  set_fact:
    postgresql: "{{ postgresql_defaults | combine(postgresql | default({}), recursive=True) }}"

- name: Ensure postgresql data directory exists
  file:
    path: "{{ postgresql_base_dir }}/data"
    state: directory

- name: Deploy docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ postgresql_base_dir }}/docker-compose.yml"
    mode: "0640"
  no_log: true

- name: Start PostgreSQL
  shell: |
    source {{ iac_shell_profile }} 2>/dev/null
    docker compose -f {{ postgresql_base_dir }}/docker-compose.yml up -d
  args:
    executable: "{{ iac_shell_executable }}"

- name: Wait for PostgreSQL to accept connections
  shell: |
    docker exec postgresql-db pg_isready -U postgres
  register: pg_ready
  retries: 30
  delay: 2
  until: pg_ready.rc == 0
  changed_when: false
