---
- name: Install node_exporter via Homebrew
  community.general.homebrew:
    name: node_exporter
    state: present

- name: Start node_exporter via Homebrew services
  command: brew services start node_exporter
  environment:
    PATH: "/opt/homebrew/bin:/usr/local/bin:{{ ansible_env.PATH }}"
  register: brew_services_start
  changed_when: "'successfully started' in brew_services_start.stdout"

- name: Wait for node_exporter to be available
  uri:
    url: "http://localhost:{{ node_exporter_port }}/metrics"
    method: GET
    status_code: 200
  register: node_exporter_health
  retries: 30
  delay: 2
  until: node_exporter_health.status == 200

- name: Display node_exporter status
  debug:
    msg:
      - "Node Exporter is running"
      - "Verify with: brew services info node_exporter"
      - "Metrics available at: http://localhost:{{ node_exporter_port }}/metrics"
