---
- name: Create shared modules directory
  ansible.builtin.file:
    path: "{{ threshold_alert_module_base }}/modules/threshold_alert"
    state: directory
    mode: '0755'
  delegate_to: localhost

- name: Render threshold_alert module main.tf
  ansible.builtin.template:
    src: modules/threshold_alert/main.tf.j2
    dest: "{{ threshold_alert_module_base }}/modules/threshold_alert/main.tf"
  delegate_to: localhost

- name: Render threshold_alert module variables.tf
  ansible.builtin.template:
    src: modules/threshold_alert/variables.tf.j2
    dest: "{{ threshold_alert_module_base }}/modules/threshold_alert/variables.tf"
  delegate_to: localhost
