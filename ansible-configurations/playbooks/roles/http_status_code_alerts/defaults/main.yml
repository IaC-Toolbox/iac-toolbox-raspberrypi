---
# Resolved at play time from grafana_alloy.instance_name or ansible_hostname
http_status_code_alerts_instance: "{{ grafana_alloy.instance_name | default(ansible_hostname) }}"

# Service name used to scope HTTP alert expressions to a specific instrumented service.
# Populated from http_status_code_alerts.service_name in iac-toolbox.yml.
# Falls back to ansible_hostname if not set.
http_status_code_alerts_service_name: "{{ http_status_code_alerts.service_name | default(ansible_hostname) }}"
