---
# ============================================
# IaC Toolbox - Arize Phoenix Uninstall Playbook
# ============================================

- name: Uninstall Arize Phoenix
  hosts: all
  gather_facts: true
  tasks:

    - name: Stop and remove Phoenix container
      command: docker compose down
      args:
        chdir: "{{ ansible_env.HOME }}/.iac-toolbox/arize-phoenix"
      become_user: "{{ ansible_user }}"
      ignore_errors: true

    - name: Remove phoenix_data Docker volume
      community.docker.docker_volume:
        name: phoenix_data
        state: absent
        docker_host: "{{ active_docker_socket }}"
      become_user: "{{ ansible_user }}"
      ignore_errors: true

    - name: Remove Arize Phoenix config directory
      file:
        path: "{{ ansible_env.HOME }}/.iac-toolbox/arize-phoenix"
        state: absent

    - name: Display uninstall summary
      debug:
        msg:
          - "Arize Phoenix has been removed."
          - "Container stopped and removed."
          - "Trace data (phoenix_data volume) removed."
          - "Config directory ~/.iac-toolbox/arize-phoenix deleted."
