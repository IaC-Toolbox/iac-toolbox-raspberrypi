---
- name: Check if docker is already installed
  command: docker --version
  register: docker_check
  changed_when: false
  failed_when: false

- name: Install Docker Desktop via brew cask
  community.general.homebrew_cask:
    name: docker
    state: present
  when: docker_check.rc != 0

- name: Verify Docker installation
  command: docker --version
  register: docker_version
  changed_when: false
  retries: 5
  delay: 3

- name: Display Docker version
  debug:
    msg: "Docker installed: {{ docker_version.stdout }}"

- name: Check if Docker daemon is running
  command: docker info
  register: docker_daemon_check
  changed_when: false
  failed_when: false

- name: Start OrbStack
  command: open -a OrbStack
  when: docker_daemon_check.rc != 0 and ansible_os_family == "Darwin"

- name: Configure Docker credential store (macOS runner)
  # docker/login-action calls docker-credential-osxkeychain to save credentials.
  # launchd services run non-interactively, so macOS blocks Keychain access with
  # "User interaction is not allowed." Setting credsStore to "" stores credentials
  # as base64 in ~/.docker/config.json instead, which works in any context.
  template:
    src: docker-config.json.j2
    dest: "{{ ansible_env.HOME }}/.docker/config.json"
    mode: '0600'
  when: ansible_os_family == "Darwin"

- name: Detect Rancher Desktop Docker socket
  stat:
    path: "{{ ansible_env.HOME }}/.rd/docker.sock"
  register: rancher_socket

- name: Detect Docker Desktop socket
  stat:
    path: "{{ ansible_env.HOME }}/.docker/run/docker.sock"
  register: docker_desktop_socket

- name: Set active Docker socket fact
  set_fact:
    active_docker_socket: >-
      {{ 'unix://' + ansible_env.HOME + '/.rd/docker.sock'
         if rancher_socket.stat.exists and rancher_socket.stat.issock
         else 'unix://' + ansible_env.HOME + '/.docker/run/docker.sock' }}
  when: >
    (rancher_socket.stat.exists and rancher_socket.stat.issock) or
    (docker_desktop_socket.stat.exists and docker_desktop_socket.stat.issock)

- name: Wait for Docker daemon to be ready
  command: docker info
  register: docker_daemon_wait
  retries: 30
  delay: 2
  until: docker_daemon_wait.rc == 0
  changed_when: false
  when: docker_daemon_check.rc != 0
