---
- name: Render shared threshold_alert module
  ansible.builtin.include_role:
    name: threshold_alert_module
  vars:
    threshold_alert_module:
      base: "{{ node_metrics_alerts.terraform_dest | dirname }}"

- name: Create Terraform destination directory
  ansible.builtin.file:
    path: "{{ node_metrics_alerts.terraform_dest }}"
    state: directory
    mode: '0755'

- name: Render providers.tf
  ansible.builtin.template:
    src: providers.tf.j2
    dest: "{{ node_metrics_alerts.terraform_dest }}/providers.tf"

- name: Render variables.tf
  ansible.builtin.template:
    src: variables.tf.j2
    dest: "{{ node_metrics_alerts.terraform_dest }}/variables.tf"

- name: Render terraform.tfvars
  ansible.builtin.template:
    src: terraform.tfvars.j2
    dest: "{{ node_metrics_alerts.terraform_dest }}/terraform.tfvars"
    mode: '0600'

- name: Render main.tf (alert rule modules)
  ansible.builtin.template:
    src: main.tf.j2
    dest: "{{ node_metrics_alerts.terraform_dest }}/main.tf"

- name: Ensure terraform.tfvars is in .gitignore
  ansible.builtin.lineinfile:
    path: "{{ node_metrics_alerts.terraform_dest }}/.gitignore"
    line: "terraform.tfvars"
    create: true
    mode: '0644'

- name: Terraform init
  ansible.builtin.command:
    cmd: terraform init
    chdir: "{{ node_metrics_alerts.terraform_dest }}"
  changed_when: false

- name: Terraform apply
  ansible.builtin.command:
    cmd: terraform apply -auto-approve
    chdir: "{{ node_metrics_alerts.terraform_dest }}"
  changed_when: true
