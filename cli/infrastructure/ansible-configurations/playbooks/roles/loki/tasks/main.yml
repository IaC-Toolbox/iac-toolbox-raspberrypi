---
- name: Create Loki base directory
  file:
    path: "{{ loki.base_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'

- name: Deploy Loki configuration
  template:
    src: loki-config.yml.j2
    dest: "{{ loki.base_dir }}/loki-config.yml"
    owner: "{{ ansible_user }}"
    mode: '0644'

- name: Deploy docker-compose configuration
  template:
    src: docker-compose.yml.j2
    dest: "{{ loki.base_dir }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    mode: '0644'

- name: Pull Loki container image
  community.docker.docker_image:
    name: "grafana/loki:{{ loki_version }}"
    source: pull
    docker_host: "{{ active_docker_socket }}"
  become_user: "{{ ansible_user }}"

- name: Wait for Loki to be ready
  uri:
    url: "http://localhost:{{ loki.port }}/ready"
    method: GET
    status_code: 200
  register: loki_health
  retries: 30
  delay: 2
  until: loki_health.status == 200

